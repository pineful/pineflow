<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Pineflow logo grid halo v5 candidates</title>
  <desc id="desc">Pine Grid 기반을 유지하고, 다이아몬드-only 몸체와 기존 PINEFLOW 워드마크를 보존한 외곽 출퇴근 그래프 라인 시안.</desc>
  <defs>
    <style>
      .bg { fill: #f5f9f3; }
      .ink { fill: #11161c; }
      .blue { fill: #5278ff; }
      .muted { fill: #68766c; }
      .card { fill: #fff; stroke: #d8e3d1; stroke-width: 1; }
      .shadow { fill: #0a241a; }
      .label { font: 700 24px Segoe UI, Arial, sans-serif; fill: #657268; letter-spacing: 0; }
      .body { font: 400 23px Segoe UI, Arial, sans-serif; fill: #657268; letter-spacing: 0; }
      .caption { font: 400 24px Segoe UI, Arial, sans-serif; fill: #101817; letter-spacing: 0; }
      .title { font: 800 56px Segoe UI, Arial, sans-serif; fill: #101817; letter-spacing: 0; }
      .sub { font: 400 25px Segoe UI, Arial, sans-serif; fill: #68766c; letter-spacing: 0; }
      .word { font: 800 60px Consolas, Cascadia Mono, Menlo, monospace; letter-spacing: 0; }
      .leaf-dark { fill: #11161c; }
      .leaf-green { fill: #54c86c; }
      .leaf-lime { fill: #9fee57; }
      .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .34; }
      .node-start { fill: #43c78d; }
      .node-end { fill: #e0b532; }
      .fail { fill: #101817; }
    </style>
    <linearGradient id="flowGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43c78d"/>
      <stop offset=".52" stop-color="#1f7a5c"/>
      <stop offset="1" stop-color="#e0b532"/>
    </linearGradient>
    <linearGradient id="flowCool" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4acb91"/>
      <stop offset=".6" stop-color="#194f3d"/>
      <stop offset="1" stop-color="#5278ff"/>
    </linearGradient>
    <g id="diamond">
      <path d="M0 -12 L12 0 L0 12 L-12 0 Z"/>
    </g>
    <g id="pine-grid">
      <!-- Diamond-only body: no filled pineapple silhouette. Slightly fuller than v3 by widening the middle row. -->
      <g class="ink">
        <use href="#diamond" x="-18" y="18"/>
        <use href="#diamond" x="18" y="18"/>
        <use href="#diamond" x="-36" y="44"/>
        <use href="#diamond" x="0" y="44"/>
        <use href="#diamond" x="36" y="44"/>
        <use href="#diamond" x="-24" y="70"/>
        <use href="#diamond" x="24" y="70"/>
        <use href="#diamond" x="0" y="96"/>
      </g>
      <use href="#diamond" x="0" y="44" class="blue"/>
      <!-- Pineapple leaves kept angular and compact, not a mountain/crown block. -->
      <path class="leaf-dark" d="M-28 -16 L-54 -58 L-18 -32 Z"/>
      <path class="leaf-dark" d="M-13 -22 L-28 -76 L4 -35 Z"/>
      <path class="leaf-dark" d="M4 -23 L10 -82 L22 -34 Z"/>
      <path class="leaf-dark" d="M17 -18 L48 -62 L31 -27 Z"/>
      <path class="leaf-green" d="M-7 -21 L-3 -70 L10 -28 Z"/>
      <path class="leaf-lime" d="M7 -23 L34 -57 L19 -24 Z"/>
    </g>
    <g id="wordmark">
      <text x="0" y="0" class="word ink">PINE</text>
      <text x="144" y="0" class="word blue">FLOW</text>
    </g>
  </defs>

  <rect class="bg" width="1800" height="1160"/>
  <text class="title" x="86" y="106">Pineflow logo grid halo v5</text>
  <text class="sub" x="88" y="158">Preserve v3 04 Pine Grid: diamond-only body, unchanged PINEFLOW wordmark, refined commute graph line.</text>

  <g transform="translate(86 220)">
    <rect class="shadow" x="0" y="18" width="780" height="360" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="360" rx="22"/>
    <text class="label" x="36" y="58">A. Route Capsule Sweep</text>
    <g transform="translate(176 178)">
      <path class="track" d="M-94 92 C-132 20 -110 -68 -35 -98 C38 -126 110 -72 104 12" stroke="#1f7a5c" stroke-width="7"/>
      <path class="route" d="M-94 92 C-132 20 -110 -68 -35 -98 C38 -126 110 -72 104 12" stroke="url(#flowGreen)" stroke-width="8"/>
      <circle class="node-start" cx="-94" cy="92" r="9"/>
      <path class="node-end" d="M103 3 h28 a7 7 0 0 1 0 14 h-28 a7 7 0 0 1 0 -14Z"/>
      <g transform="translate(0 -18) scale(1.22)">
        <use href="#pine-grid"/>
      </g>
    </g>
    <g transform="translate(380 142)">
      <use href="#wordmark"/>
    </g>
    <text class="body" x="380" y="190">Best current direction. The line passes around</text>
    <text class="body" x="380" y="222">the grid body, not through it.</text>
    <text class="caption" x="36" y="304">Pass candidate: keeps the tech grid body and adds only the commute flow.</text>
  </g>

  <g transform="translate(934 220)">
    <rect class="shadow" x="0" y="18" width="780" height="360" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="360" rx="22"/>
    <text class="label" x="36" y="58">B. Progress Arc Track</text>
    <g transform="translate(176 178)">
      <path class="track" d="M-100 72 C-135 8 -93 -86 -6 -103 C64 -116 111 -61 108 12" stroke="#9ebaaa" stroke-width="9"/>
      <path class="route" d="M-100 72 C-135 8 -93 -86 -6 -103 C51 -112 92 -78 105 -30" stroke="url(#flowCool)" stroke-width="8"/>
      <circle class="node-start" cx="-100" cy="72" r="9"/>
      <path class="node-end" d="M102 -42 L122 -30 L112 -14 L92 -26 Z"/>
      <g transform="translate(0 -18) scale(1.22)">
        <use href="#pine-grid"/>
      </g>
    </g>
    <g transform="translate(380 142)">
      <use href="#wordmark"/>
    </g>
    <text class="body" x="380" y="190">Reads more like today's work progress.</text>
    <text class="body" x="380" y="222">Open arc, never a closed ring.</text>
    <text class="caption" x="36" y="304">Pass candidate: strongest link to the dashboard progress graph.</text>
  </g>

  <g transform="translate(86 640)">
    <rect class="shadow" x="0" y="18" width="780" height="360" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="360" rx="22"/>
    <text class="label" x="36" y="58">C. Dual Commute Lane</text>
    <g transform="translate(176 178)">
      <path class="route" d="M-102 82 C-124 20 -92 -66 -26 -92 C30 -114 86 -82 104 -20" stroke="#1f7a5c" stroke-width="7"/>
      <path class="route" d="M-68 110 C-20 126 62 82 98 24" stroke="#d9bd4b" stroke-width="5"/>
      <circle class="node-start" cx="-102" cy="82" r="8"/>
      <circle class="node-end" cx="104" cy="-20" r="8"/>
      <g transform="translate(0 -18) scale(1.22)">
        <use href="#pine-grid"/>
      </g>
    </g>
    <g transform="translate(380 142)">
      <use href="#wordmark"/>
    </g>
    <text class="body" x="380" y="190">Check-in and check-out are two distinct</text>
    <text class="body" x="380" y="222">lanes, kept outside the pineapple grid.</text>
    <text class="caption" x="36" y="304">Watch candidate: clear meaning, but busier at small icon sizes.</text>
  </g>

  <g transform="translate(934 640)">
    <rect class="shadow" x="0" y="18" width="780" height="360" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="360" rx="22"/>
    <text class="label" x="36" y="58">Quality gate</text>
    <g transform="translate(114 158) scale(1.35)">
      <use href="#pine-grid"/>
    </g>
    <g transform="translate(330 132)">
      <use href="#wordmark"/>
    </g>
    <text class="body" x="330" y="190">No filled body. No wordmark change.</text>
    <text class="body" x="330" y="222">No lazy circle. No collision with diamonds.</text>
    <text class="caption" x="36" y="304">Rejected directions are not shown. A and B are the safer implementation paths.</text>
  </g>

  <g transform="translate(86 1040)">
    <rect x="0" y="0" width="1628" height="76" rx="18" fill="#11161c"/>
    <text x="34" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#9fee57">Locked rules</text>
    <text x="188" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#f2f7ef">Diamond-only body, unchanged wordmark, asymmetric commute graph line. Filled pineapple versions are rejected.</text>
  </g>
</svg>
