<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Pineflow lowercase asymmetric v9</title>
  <desc id="desc">Clean logo lockup board with lowercase pineflow wordmark, diamond-only pineapple, and stable asymmetric commute curve.</desc>
  <defs>
    <style>
      .bg { fill: #f5f9f3; }
      .ink { fill: #11161c; }
      .accent { fill: #4f7cff; }
      .muted { fill: #68766c; }
      .card { fill: #fff; stroke: #d8e3d1; stroke-width: 1; }
      .shadow { fill: #0a241a; }
      .title { font: 800 52px Segoe UI, Arial, sans-serif; fill: #101817; letter-spacing: 0; }
      .sub { font: 400 24px Segoe UI, Arial, sans-serif; fill: #68766c; letter-spacing: 0; }
      .label { font: 700 25px Segoe UI, Arial, sans-serif; fill: #657268; letter-spacing: 0; }
      .body { font: 400 23px Segoe UI, Arial, sans-serif; fill: #657268; letter-spacing: 0; }
      .caption { font: 400 24px Segoe UI, Arial, sans-serif; fill: #101817; letter-spacing: 0; }
      .word-pine { font: 800 70px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #2f6f54; }
      .word-flow { font: 400 70px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #1f2933; }
      .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="stableFlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#43c78d"/>
      <stop offset=".54" stop-color="#1f7a5c"/>
      <stop offset="1" stop-color="#e0b532"/>
    </linearGradient>
    <linearGradient id="quietFlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#55c895"/>
      <stop offset=".68" stop-color="#247457"/>
      <stop offset="1" stop-color="#aebd9f"/>
    </linearGradient>
    <g id="diamond">
      <path d="M0 -12 L12 0 L0 12 L-12 0 Z"/>
    </g>
    <g id="pine-grid">
      <g class="ink">
        <use href="#diamond" x="-18" y="18"/>
        <use href="#diamond" x="18" y="18"/>
        <use href="#diamond" x="-38" y="44"/>
        <use href="#diamond" x="0" y="44"/>
        <use href="#diamond" x="38" y="44"/>
        <use href="#diamond" x="-24" y="70"/>
        <use href="#diamond" x="24" y="70"/>
        <use href="#diamond" x="0" y="96"/>
      </g>
      <use href="#diamond" x="0" y="44" class="accent"/>
      <path class="ink" d="M-28 -16 L-54 -58 L-18 -32 Z"/>
      <path class="ink" d="M-13 -22 L-28 -76 L4 -35 Z"/>
      <path class="ink" d="M4 -23 L10 -82 L22 -34 Z"/>
      <path class="ink" d="M17 -18 L48 -62 L31 -27 Z"/>
      <path fill="#43c78d" d="M-7 -21 L-3 -70 L10 -28 Z"/>
      <path fill="#9fee57" d="M7 -23 L34 -57 L19 -24 Z"/>
    </g>
    <g id="wordmark">
      <text x="0" y="0" class="word-pine">pine</text>
      <text x="137" y="0" class="word-flow">flow</text>
    </g>
  </defs>

  <rect class="bg" width="1800" height="1040"/>
  <text class="title" x="86" y="98">Pineflow lowercase asymmetric v9</text>
  <text class="sub" x="88" y="150">Clean lockup view: lowercase wordmark, diamond-only pineapple, stable open progress line.</text>

  <g transform="translate(86 235)">
    <rect class="shadow" x="0" y="18" width="780" height="520" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="520" rx="22"/>
    <text class="label" x="36" y="58">A. Stable Progress Arc</text>
    <g transform="translate(224 242)">
      <path class="route" d="M-106 76 C-122 12 -91 -70 -22 -96 C48 -122 120 -78 118 6" stroke="#9ebaaa" stroke-width="10" opacity=".42"/>
      <path class="route" d="M-106 76 C-122 12 -91 -70 -22 -96 C39 -119 96 -89 116 -36" stroke="url(#stableFlow)" stroke-width="8"/>
      <circle cx="-106" cy="76" r="9" fill="#43c78d"/>
      <path fill="#e0b532" d="M104 -48 L126 -36 L113 -18 L92 -30 Z"/>
      <g transform="translate(0 -28) scale(1.34)">
        <use href="#pine-grid"/>
      </g>
    </g>
    <g transform="translate(438 245)">
      <use href="#wordmark"/>
    </g>
    <text class="caption" x="36" y="420">Recommended: asymmetric like the second direction, but visually anchored.</text>
    <text class="body" x="36" y="456">The curve reads as a work-progress line without becoming a closed ring.</text>
  </g>

  <g transform="translate(934 235)">
    <rect class="shadow" x="0" y="18" width="780" height="520" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="520" rx="22"/>
    <text class="label" x="36" y="58">B. Quiet Offset Arc</text>
    <g transform="translate(224 242)">
      <path class="route" d="M-96 90 C-136 12 -82 -82 -4 -101 C68 -119 112 -64 110 -10" stroke="#b8c9be" stroke-width="9" opacity=".44"/>
      <path class="route" d="M-96 90 C-136 12 -82 -82 -4 -101 C48 -114 86 -88 104 -50" stroke="url(#quietFlow)" stroke-width="7"/>
      <circle cx="-96" cy="90" r="8" fill="#43c78d"/>
      <circle cx="104" cy="-50" r="8" fill="#e0b532"/>
      <g transform="translate(0 -28) scale(1.34)">
        <use href="#pine-grid"/>
      </g>
    </g>
    <g transform="translate(438 245)">
      <use href="#wordmark"/>
    </g>
    <text class="caption" x="36" y="420">Softer: calmer and more brand-mark-like, less explicit as a graph.</text>
    <text class="body" x="36" y="456">Good if Pineflow should feel more personal than analytical.</text>
  </g>

  <g transform="translate(86 840)">
    <rect x="0" y="0" width="1628" height="86" rx="18" fill="#11161c"/>
    <text x="34" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#9fee57">Direction</text>
    <text x="166" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f2f7ef">Prefer A: unbalanced curve from the second concept, developed so the mark does not feel unstable.</text>
  </g>
</svg>
