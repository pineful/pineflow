<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Pineflow rhythmic progress v15</title>
  <desc id="desc">Refined Pineflow logo candidates with rhythmic diamond rotation, off-center accent facets, and crafted single progress arc terminals.</desc>
  <defs>
    <style>
      .bg { fill: #f5f9f3; }
      .ink { fill: #11161c; }
      .pine { fill: #2f6f54; }
      .flow { fill: #1f2933; }
      .accent-a { fill: #2f6f54; }
      .accent-b { fill: #43c78d; }
      .muted { fill: #68766c; }
      .card { fill: #fff; stroke: #d8e3d1; stroke-width: 1; }
      .shadow { fill: #0a241a; }
      .panel { fill: #f1f6ef; stroke: #d8e3d1; stroke-width: 1; }
      .title { font: 800 52px Segoe UI, Arial, sans-serif; fill: #101817; letter-spacing: 0; }
      .sub { font: 400 24px Segoe UI, Arial, sans-serif; fill: #68766c; letter-spacing: 0; }
      .label { font: 700 24px Segoe UI, Arial, sans-serif; fill: #657268; letter-spacing: 0; }
      .body { font: 400 23px Segoe UI, Arial, sans-serif; fill: #657268; letter-spacing: 0; }
      .caption { font: 400 24px Segoe UI, Arial, sans-serif; fill: #101817; letter-spacing: 0; }
      .word-pine { font: 800 76px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #2f6f54; }
      .word-flow { font: 400 76px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #1f2933; }
      .word-pine-small { font: 800 38px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #2f6f54; }
      .word-flow-small { font: 400 38px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #1f2933; }
      .arc { fill: none; stroke: #1f7a5c; stroke-linejoin: round; }
      .arc-round { stroke-linecap: round; }
      .arc-cut { stroke-linecap: butt; }
    </style>
    <g id="diamond">
      <path d="M0 -14 L14 0 L0 14 L-14 0 Z"/>
    </g>
    <g id="pine-grid-rhythm">
      <!-- Optical rhythm: slight rotations are deliberate, mirrored, and bounded. -->
      <use href="#diamond" class="ink" transform="translate(0 10) rotate(0)"/>
      <use href="#diamond" class="ink" transform="translate(-23 36) rotate(-4)"/>
      <use href="#diamond" class="ink" transform="translate(23 36) rotate(3)"/>
      <use href="#diamond" class="ink" transform="translate(-46 62) rotate(3)"/>
      <use href="#diamond" class="ink" transform="translate(0 62) rotate(-2)"/>
      <use href="#diamond" class="accent-a" transform="translate(46 62) rotate(4)"/>
      <use href="#diamond" class="ink" transform="translate(-23 88) rotate(-3)"/>
      <use href="#diamond" class="accent-b" transform="translate(23 88) rotate(2)"/>
      <use href="#diamond" class="ink" transform="translate(0 114) rotate(0)"/>
      <path class="ink" d="M-28 -16 L-54 -58 L-18 -32 Z"/>
      <path class="ink" d="M-13 -22 L-28 -76 L4 -35 Z"/>
      <path class="ink" d="M4 -23 L10 -82 L22 -34 Z"/>
      <path class="ink" d="M17 -18 L48 -62 L31 -27 Z"/>
      <path fill="#43c78d" d="M-7 -21 L-3 -70 L10 -28 Z"/>
      <path fill="#9fee57" d="M7 -23 L34 -57 L19 -24 Z"/>
    </g>
    <g id="symbol-cut">
      <path class="arc arc-round" d="M-123 99 C-143 8 -78 -106 24 -118 C102 -127 139 -62 128 -12" stroke-width="20"/>
      <!-- A terminal cut trims the visual end without adding a marker. -->
      <path d="M121 -34 L151 -22 L139 6 L111 -6 Z" fill="#fff"/>
      <g transform="translate(0 -42) scale(1.25)">
        <use href="#pine-grid-rhythm"/>
      </g>
    </g>
    <g id="symbol-taper">
      <!-- Two adjacent segments act as optical taper while remaining one continuous arc shape. -->
      <path class="arc arc-round" d="M-123 99 C-143 8 -78 -106 24 -118 C82 -125 119 -88 128 -42" stroke-width="20"/>
      <path class="arc arc-round" d="M126 -44 C132 -34 132 -22 128 -12" stroke-width="13"/>
      <g transform="translate(0 -42) scale(1.25)">
        <use href="#pine-grid-rhythm"/>
      </g>
    </g>
    <g id="wordmark">
      <text x="0" y="0" class="word-pine">pine</text>
      <text x="149" y="0" class="word-flow">flow</text>
    </g>
    <g id="wordmark-small">
      <text x="0" y="0" class="word-pine-small">pine</text>
      <text x="75" y="0" class="word-flow-small">flow</text>
    </g>
  </defs>

  <rect class="bg" width="1800" height="1160"/>
  <text class="title" x="86" y="98">Pineflow rhythmic progress v15</text>
  <text class="sub" x="88" y="150">Off-center accent facets, controlled diamond rhythm, and crafted arc terminals.</text>

  <g transform="translate(86 225)">
    <rect class="shadow" x="0" y="18" width="780" height="540" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="540" rx="22"/>
    <text class="label" x="42" y="62">A. Cut Terminal Arc</text>
    <g transform="translate(250 274) scale(1.04)">
      <use href="#symbol-cut"/>
    </g>
    <g transform="translate(440 288) scale(.82)">
      <use href="#wordmark"/>
    </g>
    <text class="caption" x="42" y="438">Recommended: strongest crafted ending.</text>
    <text class="body" x="42" y="474">No marker is added; the end is simply cut with intent.</text>
  </g>

  <g transform="translate(934 225)">
    <rect class="shadow" x="0" y="18" width="780" height="540" rx="22"/>
    <rect class="card" x="0" y="0" width="780" height="540" rx="22"/>
    <text class="label" x="42" y="62">B. Tapered Terminal Arc</text>
    <g transform="translate(250 274) scale(1.04)">
      <use href="#symbol-taper"/>
    </g>
    <g transform="translate(440 288) scale(.82)">
      <use href="#wordmark"/>
    </g>
    <text class="caption" x="42" y="438">Softer: end slowly loses weight.</text>
    <text class="body" x="42" y="474">More graceful, but slightly less decisive than A.</text>
  </g>

  <g transform="translate(86 825)">
    <rect class="panel" x="0" y="0" width="500" height="180" rx="18"/>
    <text class="label" x="28" y="44">Header scale</text>
    <g transform="translate(102 112) scale(.42)">
      <use href="#symbol-cut"/>
    </g>
    <g transform="translate(215 116)">
      <use href="#wordmark-small"/>
    </g>
  </g>

  <g transform="translate(650 825)">
    <rect class="panel" x="0" y="0" width="500" height="180" rx="18"/>
    <text class="label" x="28" y="44">App icon scale</text>
    <g transform="translate(250 118) scale(.62)">
      <use href="#symbol-cut"/>
    </g>
  </g>

  <g transform="translate(1214 825)">
    <rect x="0" y="0" width="500" height="180" rx="18" fill="#11161c"/>
    <text x="28" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#9fee57">Decision</text>
    <text x="28" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f2f7ef">Accent facets move off-center.</text>
    <text x="28" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f2f7ef">Rotation is rhythmic, not random.</text>
  </g>
</svg>
