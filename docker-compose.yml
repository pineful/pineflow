services:
  postgres:
    # Local PostgreSQL only for the legacy Docker/PostgreSQL PoC.
    # Do not use this compose file for production Serverless operation.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pineflow
      POSTGRES_USER: pineflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting local PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pineflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pineflow -d pineflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pineflow_postgres:
