services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pineflow
      POSTGRES_USER: pineflow
      POSTGRES_PASSWORD: pineflow
    ports:
      - "5432:5432"
    volumes:
      - pineflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pineflow -d pineflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pineflow_postgres:
