services:
  app:
    image: ghcr.io/pineful/pineflow-app:${APP_IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      PORT: 3001
      DATABASE_SSL: "false"
    ports:
      - "80:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    volumes:
      - pineflow_postgres:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    shm_size: 128mb
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pineflow_postgres:
