name: Pineflow Serverless Rollback

# 본선 Serverless 배포를 이전의 알려진 정상 커밋(SHA/태그)으로 되돌린다.
#
# 중요 (OIDC 가드레일):
# - GitHub OIDC trust policy subject는 `refs/heads/<branch>`(기본 main)로
#   고정돼 있다(infra/bootstrap/github-oidc-deploy-role.template.yaml).
# - 따라서 이 workflow는 반드시 **main 브랜치에서** 실행해야 한다. Actions UI의
#   "Use workflow from"을 main으로 둔 채 `target_ref`에 되돌릴 커밋 SHA/태그를
#   입력한다. OIDC 토큰 subject는 main으로 유지되고, 배포 코드만 과거 ref가 된다.
# - cdk deploy가 해당 ref의 템플릿으로 인프라까지 되돌리므로 프론트엔드와
#   백엔드가 함께 그 시점 상태로 정렬된다.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "되돌릴 커밋 SHA 또는 태그 (이전의 정상 배포 지점)"
        required: true
        type: string

concurrency:
  group: pineflow-serverless-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back serverless stack to a known-good ref
    runs-on: ubuntu-latest
    # main에서 실행할 때만, 그리고 필수 배포 변수가 모두 있을 때만 동작한다.
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.BUDGET_ALERT_EMAIL != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build frontend (validate target ref)
        run: npm run build

      - name: Install infrastructure dependencies
        working-directory: infra
        run: npm ci

      - name: Verify infrastructure guardrails
        working-directory: infra
        run: npm run verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CDK stack at target ref
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json --parameters BudgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL }}

      - name: Export frontend environment
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const outputs = require("./infra/cdk-outputs.json").PineflowServerlessStack;
          const apiEndpoint = outputs.ApiEndpoint.endsWith("/")
            ? outputs.ApiEndpoint.slice(0, -1)
            : outputs.ApiEndpoint;
          console.log(`VITE_API_BASE_URL=${apiEndpoint}`);
          console.log(`VITE_COGNITO_REGION=${process.env.AWS_REGION}`);
          console.log(`VITE_COGNITO_USER_POOL_ID=${outputs.UserPoolId}`);
          console.log(`VITE_COGNITO_USER_POOL_CLIENT_ID=${outputs.UserPoolClientId}`);
          console.log(`FRONTEND_BUCKET_NAME=${outputs.FrontendBucketName}`);
          console.log(`FRONTEND_DISTRIBUTION_ID=${outputs.FrontendDistributionId}`);
          NODE

      - name: Build frontend for deployed API
        run: npm run build

      - name: Upload frontend to S3
        run: aws s3 sync dist "s3://$FRONTEND_BUCKET_NAME" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$FRONTEND_DISTRIBUTION_ID" --paths "/index.html" "/assets/*"

      - name: Rollback summary
        run: |
          echo "Rolled back Pineflow serverless stack to ${{ inputs.target_ref }}" >> "$GITHUB_STEP_SUMMARY"
